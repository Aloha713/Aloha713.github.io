name: Validate Talk Map

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: talkmap

      - name: Check the existing map without generating content
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path("talkmap/map.html").read_text()
          assert "L.tileLayer('https://" in page
          assert "L.tileLayer('http://" not in page
          assert "leaflet@1.9.4" in page
          assert page.count("integrity=") == 2
          assert Path("talkmap/org-locations.js").is_file()
          assert Path("talkmap/leaflet_dist/leaflet.markercluster-src.js").is_file()
          print("Existing talk map validated; no scraping, staging, or publishing.")
          PY
